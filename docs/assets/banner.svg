<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="opencode-cordon: a permission cordon for OpenCode 2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#162033" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)" opacity="0.55"/>
  <ellipse cx="1080" cy="20" rx="300" ry="200" fill="#1f6feb" opacity="0.12" filter="url(#glow)"/>
  <ellipse cx="80" cy="320" rx="240" ry="140" fill="#2ea043" opacity="0.10" filter="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="64" y="84" fill="#58a6ff" font-size="12" letter-spacing="4">OPENCODE 2 PLUGIN</text>
    <text x="64" y="156" fill="url(#accent)" font-size="57" font-weight="700" letter-spacing="-1">opencode-cordon</text>
    <text x="64" y="194" fill="#9aa7b8" font-size="18">Declarative permission policy with an audit trail.</text>
    <text x="64" y="219" fill="#6f7d90" font-size="14.5">Rules in your repo. Every decision logged.</text>

    <g transform="translate(64, 250)">
      <rect x="0" y="0" width="182" height="32" rx="16" fill="#0f1a2b" stroke="#24324a"/>
      <text x="16" y="21" fill="#7ee787" font-size="12.5">permission.evaluate</text>
      <rect x="194" y="0" width="120" height="32" rx="16" fill="#0f1a2b" stroke="#24324a"/>
      <text x="210" y="21" fill="#58a6ff" font-size="12.5">JSONL audit</text>
      <rect x="326" y="0" width="136" height="32" rx="16" fill="#0f1a2b" stroke="#24324a"/>
      <text x="342" y="21" fill="#d2a8ff" font-size="12.5">HTML report</text>
      <rect x="474" y="0" width="140" height="32" rx="16" fill="#0f1a2b" stroke="#24324a"/>
      <text x="490" y="21" fill="#f0883e" font-size="12.5">tighten-only</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <rect x="636" y="58" width="500" height="214" rx="14" fill="#0a111d" stroke="#223049"/>
    <rect x="636" y="58" width="500" height="34" rx="14" fill="#101a2b"/>
    <circle cx="658" cy="75" r="4.5" fill="#f85149"/>
    <circle cx="674" cy="75" r="4.5" fill="#d29922"/>
    <circle cx="690" cy="75" r="4.5" fill="#3fb950"/>
    <text x="708" y="80" fill="#6f7d90" font-size="12">sh — cordon</text>

    <text x="660" y="124" fill="#6f7d90" font-size="13">$</text>
    <text x="678" y="124" fill="#d7dee8" font-size="13">cordon evaluate --action shell</text>
    <text x="678" y="144" fill="#6f7d90" font-size="13">  --command "rm -rf /tmp/x"</text>

    <text x="660" y="178" fill="#f85149" font-size="13" font-weight="700">deny</text>
    <text x="706" y="178" fill="#9aa7b8" font-size="13">rule preset:destructive</text>
    <text x="660" y="197" fill="#6f7d90" font-size="12">      irreversible shell command</text>

    <text x="660" y="230" fill="#6f7d90" font-size="13">$</text>
    <text x="678" y="230" fill="#d7dee8" font-size="13">cordon audit --html report.html</text>
    <text x="660" y="252" fill="#7ee787" font-size="12">2 denied · 25 events · 1 session</text>

    <line x1="660" y1="278" x2="1112" y2="278" stroke="#1b2638" stroke-width="1"/>
    <text x="660" y="302" fill="#4d5b70" font-size="11.5">npm i -g opencode-cordon · MIT · node ≥ 20</text>
  </g>
</svg>
